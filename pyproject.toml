[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudledger"
version = "1.3.5"
description = "Local review workstation for public-data healthcare billing anomalies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Henry" }]
dependencies = [
  "duckdb>=1.4.2,<2",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "jinja2>=3.1.0",
  "networkx>=3.2",
  "pyyaml>=6.0",
  "reportlab>=4.0.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
fraudledger = "fraudledger.cli:main"

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraudledger = ["default_config.yaml", "templates/*.html"]
